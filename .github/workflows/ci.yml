name: CI Quality Gate

on:
  push:
    branches: [ "saiteja", "main" ]
  pull_request:
    branches: [ "saiteja", "main" ]

jobs:
  backend-quality:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-mock

      - name: Run Backend Unit & Security Tests
        env:
          ENVIRONMENT: "development"
          JWT_SECRET_KEY: "ci-secret-token-key-for-automated-tests-only-32bytes"
        run: |
          pytest tests/test_chat_security_websocket.py \
                 tests/test_phase13_evaluation_metrics.py \
                 tests/test_phase11_config_security_audit.py \
                 tests/test_phase10_adaptive_validation.py \
                 tests/test_phase8_reranker_validation.py \
                 --verbose

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Frontend
        run: npm run build
